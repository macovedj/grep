[package]
name = "uu_grep"
description = "A Rust implementation of GNU Grep"
repository = "https://github.com/uutils/grep"
edition = "2024"
rust-version = "1.88.0"
version = "0.2.0"
license = "MIT"
homepage = "https://github.com/uutils/grep"
keywords = ["grep", "uutils", "cross-platform", "cli", "utility"]
categories = ["command-line-utilities"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "grep"
path = "src/main.rs"

[lib]
name = "uu_grep"
path = "src/lib.rs"

[features]
default = ["onig"]
onig = ["dep:onig", "dep:onig_sys"]
# Experimental GNU BRE/ERE adapter. Takes precedence over Onig for -G/-E/-F;
# keep `onig` enabled as well if -P is needed.
rust-matcher = ["dep:regex-automata", "dep:regex-syntax", "dep:fancy-regex"]

[dependencies]
clap = { version = "4.5", features = ["wrap_help", "cargo", "color"] }
glob = "0.3.1"
memchr = "2.7.2"
onig = { version = "~6.5.1", default-features = false, optional = true }
onig_sys = { version = "69.9.3", default-features = false, optional = true }
regex-automata = { version = "=0.4.18", optional = true }
regex-syntax = { version = "0.8", optional = true }
fancy-regex = { version = "=0.19.2", features = ["leftmost_longest"], optional = true }
uucore = "0.12.0"
walkdir = "2.5"

[[bench]]
name = "grep_bench"
harness = false

[dev-dependencies]
criterion = { version = "5.0.0", package = "codspeed-criterion-compat" }
uutests = "0.12.0"

[profile.release]
lto = "fat"
panic = "abort"
codegen-units = 1

[profile.dist]
inherits = "release"
